<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">TrustRehearsal requirements at a glance</title><desc id="desc">The requirements cover controlled certificate changes, traceable TLS evidence, and a read-only public explorer. The full SRS documents requirements and acceptance criteria, not a certification that all targets are complete.</desc>
<rect width="1200" height="330" rx="18" fill="#101d34"/>
<g font-family="Arial, sans-serif"><text x="38" y="43" fill="#99b9ff" font-size="12" font-weight="700" letter-spacing="2">SOFTWARE REQUIREMENTS SPECIFICATION</text>
<text x="38" y="83" fill="#ffffff" font-size="28" font-weight="700">From a trust change to inspectable evidence.</text>
<g fill="#192a46" stroke="#334765"><rect x="38" y="117" width="360" height="145" rx="10"/><rect x="420" y="117" width="360" height="145" rx="10"/><rect x="802" y="117" width="360" height="145" rx="10"/></g>
<g fill="#99b9ff" font-size="12" font-weight="700"><text x="58" y="145">01 / CONTROLLED EXPERIMENTS</text><text x="440" y="145">02 / TRACEABLE EVIDENCE</text><text x="822" y="145">03 / PUBLIC EXPLORATION</text></g>
<g fill="#ffffff" font-size="19" font-weight="700"><text x="58" y="179">Renew. Interrupt. Migrate.</text><text x="440" y="179">Observe. Assert. Recover.</text><text x="822" y="179">Inspect. Compare. Export.</text></g>
<g fill="#c5d2e6" font-size="14"><text x="58" y="211">Certificate reload · issuance failure</text><text x="58" y="236">Staged Root A → B migration</text><text x="440" y="211">Fresh TLS probes · event references</text><text x="440" y="236">Fingerprints · recovery verification</text><text x="822" y="211">Recorded provenance · no login</text><text x="822" y="236">Read-only viewer · structured reports</text></g>
<text x="38" y="300" fill="#aebed6" font-size="13">Read the full SRS for priorities, acceptance criteria, outcome semantics, and nonfunctional targets.</text>
</g></svg>
