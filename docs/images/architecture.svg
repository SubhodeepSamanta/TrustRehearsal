<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">TrustRehearsal architecture</title><desc id="desc">A recorded viewer reads exported evidence. A separate local worker probes the gateway, orders, and ledger HTTPS chain and stores events in MongoDB.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1200" height="530" rx="20" fill="#f6f8fc"/>
<g font-family="Arial, sans-serif" fill="#17243a"><text x="40" y="48" font-size="25" font-weight="700">Two modes. One evidence contract.</text>
<rect x="40" y="80" width="340" height="405" rx="16" fill="white" stroke="#d8dfeb"/>
<text x="64" y="117" font-size="13" fill="#315cca" font-weight="700">PUBLIC · READ ONLY</text><text x="64" y="151" font-size="22" font-weight="700">Recorded explorer</text>
<text x="64" y="183" font-size="15">React + TypeScript</text><text x="64" y="210" font-size="15">Timeline · comparison · reports</text>
<rect x="64" y="256" width="292" height="86" rx="10" fill="#eef3ff"/><text x="84" y="290" font-size="17" font-weight="700">Validated snapshot JSON</text><text x="84" y="317" font-size="14">9 recorded runs · visible provenance</text>
<text x="64" y="407" font-size="15">No login or running lab required.</text><text x="64" y="435" font-size="15">No experiment execution.</text>
<rect x="410" y="80" width="750" height="405" rx="16" fill="white" stroke="#d8dfeb"/>
<text x="438" y="117" font-size="13" fill="#315cca" font-weight="700">LOCAL · AUTHENTICATED EXECUTION</text>
<rect x="438" y="141" width="320" height="66" rx="10" fill="#eef3ff"/><text x="458" y="169" font-size="17" font-weight="700">Node.js API + scenario worker</text><text x="458" y="192" font-size="14">Controlled changes · fresh TLS probes</text>
<rect x="820" y="141" width="310" height="66" rx="10" fill="#f3f5f8"/><text x="840" y="169" font-size="17" font-weight="700">MongoDB</text><text x="840" y="192" font-size="14">Runs · events · assertions</text>
<path d="M760 174 H810" stroke="#64748b" marker-end="url(#arrow)" fill="none" stroke-width="2"/>
<path d="M598 210 V255" stroke="#64748b" marker-end="url(#arrow)" fill="none" stroke-width="2"/>
<g fill="#f8fafc" stroke="#cbd5e1"><rect x="438" y="269" width="190" height="64" rx="10"/><rect x="688" y="269" width="190" height="64" rx="10"/><rect x="938" y="269" width="190" height="64" rx="10"/></g>
<g font-size="18" font-weight="700"><text x="491" y="307">Gateway</text><text x="750" y="307">Orders</text><text x="999" y="307">Ledger</text></g>
<g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M631 300 H679"/><path d="M881 300 H929"/></g>
<text x="638" y="286" font-size="12">TLS</text><text x="888" y="286" font-size="12">TLS</text>
<text x="438" y="375" font-size="15">Root A / Root B · per-caller trust bundles</text><text x="438" y="405" font-size="15">Loopback issuance proxy · authenticated management</text><text x="438" y="447" font-size="14" fill="#64748b">Export sanitized reports to the recorded explorer.</text>
